name: Bug report
description: Report a problem with one of the Exein Homebrew tools
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Do not report security vulnerabilities here.** Please follow the
        [security policy](https://github.com/exein-io/homebrew-tools/security/policy) instead.

        ⚠️ **Redact any secrets** (such as your `api-key`) from workflow snippets and logs before posting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: homebrew-tool
    attributes:
      label: Tool Name (formula)
      description: Name of the homebrew formula you are reporting the bug for (e.g. `analyzer-cli`)?
      placeholder: "e.g. analyzer-cli"
    validations:
      required: true
  - type: input
    id: formula-version
    attributes:
      label: Formula version / ref
      description: Which version or ref of the fomula did you use (e.g. `@v0`, `@v0.2.0`, a commit SHA)?
      placeholder: "e.g. @v0.5.2"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant logs. Remember to redact secrets. This will be automatically formatted, so no backticks needed.
      render: shell
    validations:
      required: false
